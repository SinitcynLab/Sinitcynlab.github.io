---
layout: default
---
<div class="container" style="padding-top: 3.5rem; padding-bottom: 4rem;">
    <article class="post-card">
        <header class="post-header" style="text-align: center; margin-bottom: 2.5rem;">
            <h1 class="post-title" style="margin-bottom: 0.5rem; font-size: 2.5rem;">{{ page.title }}</h1>
            <p class="post-meta" style="color: var(--muted); font-size: 0.95rem;">
                <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
                {% if page.author %}
                <span style="margin: 0 0.5rem;">•</span>
                <span class="author">{{ page.author }}</span>
                {% endif %}
            </p>
        </header>

        <div class="post-content">
            {{ content }}
        </div>
    </article>
</div>
